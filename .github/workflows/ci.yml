name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Repository file checks
        run: python3 scripts/check_repository_files.py
      - name: Core tests
        run: swift test
      - name: Reminder recovery integration
        run: ./scripts/check_recovery.sh
      - name: Build macOS app
        run: >-
          xcodebuild -project Gudu.xcodeproj -scheme Gudu
          -configuration Release -derivedDataPath build
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify reproducible project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- Gudu.xcodeproj
